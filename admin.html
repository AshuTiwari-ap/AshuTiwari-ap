<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | S.D.S Convent School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="fw-bold text-center mb-4">Admin Panel Login</h2>
            <form id="adminLoginForm" class="row g-3 mb-4">
              <div class="col-md-6"><input id="username" class="form-control" placeholder="Username" required></div>
              <div class="col-md-6"><input id="password" type="password" class="form-control" placeholder="Password" required></div>
              <div class="col-12 text-center"><button class="btn btn-primary px-5">Login</button></div>
            </form>
            <div id="adminDashboard" class="d-none">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Dashboard</h3>
                <a href="index.html" class="btn btn-outline-secondary btn-sm">Back to Website</a>
              </div>
              <div class="row g-3 mb-4">
                <div class="col-md-4"><div class="card p-3"><h6>Total Students</h6><h4 id="totalStudents">0</h4></div></div>
                <div class="col-md-4"><div class="card p-3"><h6>Total Staff</h6><h4 id="totalStaff">0</h4></div></div>
                <div class="col-md-4"><div class="card p-3"><h6>Total Notices</h6><h4 id="totalNotices">0</h4></div></div>
              </div>

              <div class="row g-4">
                <div class="col-md-6">
                  <h5>Upload Notice</h5>
                  <form id="noticeForm" class="row g-2">
                    <div class="col-12">
                      <select id="notice_type" class="form-select" required>
                        <option value="Exam Notice">Exam Notice</option>
                        <option value="Holiday Notice">Holiday Notice</option>
                        <option value="General Information">General Information</option>
                      </select>
                    </div>
                    <div class="col-12"><textarea id="notice_content" class="form-control" rows="3" placeholder="Write notice" required></textarea></div>
                    <div class="col-12"><button class="btn btn-primary w-100">Post Notice</button></div>
                  </form>
                </div>
                <div class="col-md-6">
                  <h5>Add Meeting</h5>
                  <form id="meetingForm" class="row g-2">
                    <div class="col-6"><input id="meeting_date" type="date" class="form-control" required></div>
                    <div class="col-6"><input id="meeting_time" type="time" class="form-control" required></div>
                    <div class="col-12"><input id="meeting_purpose" class="form-control" placeholder="Purpose" required></div>
                    <div class="col-12"><button class="btn btn-success w-100">Schedule Meeting</button></div>
                  </form>
                </div>
              </div>

              <div class="mt-4">
                <h5>Backup System</h5>
                <a class="btn btn-dark" href="backend/backup.php" target="_blank">Download Database Backup</a>
              </div>
            </div>
            <p id="adminMessage" class="text-danger text-center mb-0"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
